<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">Brekka. We take enterprise AI from pilot to production.</title>
  <rect width="1200" height="630" fill="#14171A"/>

  <!-- Diagram grammar: outlined node = stage, copper filled node = production
       milestone, dashed line = exploratory leg, solid line = committed leg. -->
  <path d="M770 548 C 795 536, 818 520, 840 500 C 872 472, 902 442, 930 410" fill="none" stroke="#E39468" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 15"/>
  <path d="M930 410 C 964 372, 994 332, 1020 290 C 1048 246, 1074 202, 1100 160" fill="none" stroke="#E39468" stroke-width="5" stroke-linecap="round"/>
  <circle cx="840" cy="500" r="15" fill="#14171A" stroke="#EFEDE7" stroke-width="4"/>
  <circle cx="930" cy="410" r="15" fill="#14171A" stroke="#EFEDE7" stroke-width="4"/>
  <circle cx="1020" cy="290" r="30" fill="none" stroke="#E39468" stroke-width="2" opacity=".4"/>
  <circle cx="1020" cy="290" r="18" fill="#E39468"/>
  <circle cx="1100" cy="160" r="15" fill="#14171A" stroke="#EFEDE7" stroke-width="4"/>

  <!-- Mark and wordmark -->
  <g transform="translate(80 76) scale(1.75)">
    <rect width="32" height="32" rx="7" fill="#EFEDE7"/>
    <path fill="#14171A" fill-rule="evenodd" d="M9 7H17A4.75 4.75 0 0 1 20 15.4A5.25 5.25 0 0 1 18 25H9ZM13 10.6V14H16.6A1.7 1.7 0 0 0 16.6 10.6ZM13 17.6V21.4H17.4A1.9 1.9 0 0 0 17.4 17.6Z"/>
  </g>
  <text x="154" y="118" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#EFEDE7">Brekka</text>

  <!-- Headline -->
  <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Noto Serif', 'Liberation Serif', 'DejaVu Serif', serif" font-size="56" font-weight="400" letter-spacing="-1" fill="#EFEDE7">
    <text x="80" y="322">We take enterprise AI</text>
    <text x="80" y="392">from pilot to production.</text>
  </g>

  <rect x="80" y="470" width="64" height="2" fill="#E39468"/>
  <text x="80" y="528" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="26" fill="#B4B9BE">Senior engineers, embedded with your teams.</text>
</svg>
